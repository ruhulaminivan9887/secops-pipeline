title: Suspicious Process Spawning via Windows Telemetry
id: 9a7141-secops-pipeline-rule
status: experimental
description: Detects suspicious process spawning behavior captured via Windows Event ID 4688 logs.
author: Ruhul Amin Ivan
date: 2026/10/14
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4688
    NewProcessName|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
  condition: selection
falsepositives:
  - Administrative maintenance scripts
level: medium
