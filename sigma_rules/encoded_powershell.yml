title: PowerShell Launched With Encoded Command
id: 0b7e4c9a-2f31-4d68-8a15-5e9c7d3b2a11
status: experimental
description: Detects PowerShell started with an encoded (Base64) command line, often used to hide what a script does.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/
author: Ruhul Amin Ivan
date: 2026/10/19
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cmd:
        CommandLine|re: '(?i)\s-e(?:nc(?:odedcommand)?|c)?\s+[A-Za-z0-9+/=]{20,}'
    condition: selection_image and selection_cmd
falsepositives:
    - Management and deployment tools that pass encoded scripts (check the parent process and install path)
level: medium
